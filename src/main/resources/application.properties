spring.application.name=login-service

spring.data.mongodb.uri=mongodb://localhost:27017/logindb
# @Indexed annotations (e.g. the unique index on User.username) are not applied unless this is on.
spring.data.mongodb.auto-index-creation=true

jwt.secret=change-this-development-only-jwt-signing-secret-min-32-bytes
jwt.expiration-ms=3600000

# Requests allowed per client IP per endpoint (login/register), refilling every refill-seconds
ratelimit.capacity=5
ratelimit.refill-seconds=60
