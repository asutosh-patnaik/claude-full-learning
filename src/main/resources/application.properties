spring.application.name=login-service

spring.data.mongodb.uri=mongodb://localhost:27017/logindb
# @Indexed annotations (e.g. the unique index on User.username) are not applied unless this is on.
spring.data.mongodb.auto-index-creation=true

# RSA key pair (PKCS8 private / X.509 public, base64 DER, no PEM headers) generated for local dev
# only via:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
#   openssl pkcs8 -topk8 -nocrypt -in private.pem -outform DER | base64 | tr -d '\n'   # -> jwt.private-key
#   openssl pkey -in private.pem -pubout -outform DER | base64 | tr -d '\n'            # -> jwt.public-key
# Must be `pkcs8 -topk8`, not `pkey -outform DER`, for the private key: on LibreSSL (macOS's default
# /usr/bin/openssl) `pkey -outform DER` emits traditional PKCS1 DER instead of PKCS8, which Java's
# PKCS8EncodedKeySpec rejects with "algid parse error, not a sequence".
# In production these come from a secrets manager (JWT_PRIVATE_KEY / JWT_PUBLIC_KEY env vars), never
# checked into source control. Only the private key is actually sensitive; the public key is safe to
# expose to anything that only needs to verify tokens, never mint them.
jwt.private-
jwt.public-
jwt.expiration-ms=3600000

# Requests allowed per client IP per endpoint (login/register), refilling every refill-seconds
ratelimit.capacity=5
ratelimit.refill-seconds=60
