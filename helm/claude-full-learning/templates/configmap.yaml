apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "claude-full-learning.fullname" . }}-config
  namespace: {{ include "claude-full-learning.namespace" . }}
  labels:
    {{- include "claude-full-learning.labels" . | nindent 4 }}
data:
  SPRING_DATA_MONGODB_URI: {{ include "claude-full-learning.mongoUri" . | quote }}
  LOGGING_LEVEL_ROOT: {{ .Values.config.logLevel | quote }}
  RATELIMIT_CAPACITY: {{ .Values.config.rateLimitCapacity | quote }}
  RATELIMIT_REFILL_SECONDS: {{ .Values.config.rateLimitRefillSeconds | quote }}
