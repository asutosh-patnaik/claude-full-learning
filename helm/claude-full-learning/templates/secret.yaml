{{- if not .Values.secrets.jwtPrivateKey }}
{{- fail "secrets.jwtPrivateKey is required - pass real values via -f values-<env>.secrets.yaml (see helm/claude-full-learning/README.md and helm/claude-full-learning/values-secrets.yaml.example). Never commit real key material." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-full-learning.fullname" . }}-secrets
  namespace: {{ include "claude-full-learning.namespace" . }}
  labels:
    {{- include "claude-full-learning.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-active-key-id: {{ .Values.secrets.jwtActiveKeyId | b64enc }}
  jwt-key-id: {{ .Values.secrets.jwtKeyId | b64enc }}
  jwt-private-key: {{ .Values.secrets.jwtPrivateKey | b64enc }}
  jwt-public-key: {{ .Values.secrets.jwtPublicKey | b64enc }}
  jwt-expiration-ms: {{ .Values.secrets.jwtExpirationMs | toString | b64enc }}
