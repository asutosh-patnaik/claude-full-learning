{{- if .Values.grafanaDashboard.enabled }}
# The `grafana_dashboard: "1"` label + kube-prometheus-stack's bundled Grafana sidecar
# (sidecar.dashboards.searchNamespace: ALL is that chart's current default) is what picks this up
# automatically - no manual import needed. Requires scripts/observability.sh to have installed
# kube-prometheus-stack first.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "java-spring-auth-service-claude.fullname" . }}-dashboard
  namespace: {{ include "java-spring-auth-service-claude.namespace" . }}
  labels:
    {{- include "java-spring-auth-service-claude.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  java-spring-auth-service-claude.json: |
{{ .Files.Get "dashboards/java-spring-auth-service-claude.json" | indent 4 }}
{{- end }}
