{{- if .Values.autoscaling.enabled }}
# Requires minikube's `metrics-server` addon (see scripts/start.sh) - without it this shows
# <unknown> for current CPU utilization forever and never actually scales. Real gotcha, not
# hypothetical - check `kubectl top pods` works before assuming this is broken.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "java-spring-auth-service-claude.fullname" . }}
  namespace: {{ include "java-spring-auth-service-claude.namespace" . }}
  labels:
    {{- include "java-spring-auth-service-claude.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "java-spring-auth-service-claude.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
