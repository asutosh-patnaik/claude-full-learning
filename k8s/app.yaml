# imagePullPolicy: Never — this expects the image to already be loaded into the cluster's
# local image cache via `minikube image load java-spring-auth-service-claude:latest` (see README), not
# pulled from a registry. TCP-socket probes rather than an HTTP health endpoint: the app has
# no /actuator/health (no Spring Boot Actuator dependency), and every real HTTP route either
# requires POST or a valid JWT, so a plain GET health check would misreport as unhealthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-spring-auth-service-claude
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-spring-auth-service-claude
  template:
    metadata:
      labels:
        app: java-spring-auth-service-claude
    spec:
      containers:
        - name: app
          image: java-spring-auth-service-claude:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://mongo:27017/logindb
            - name: JWT_ACTIVE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-active-key-id
            - name: JWT_KEYS_0_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-key-id
            - name: JWT_KEYS_0_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-private-key
            - name: JWT_KEYS_0_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-public-key
            - name: JWT_EXPIRATION_MS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-expiration-ms
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: java-spring-auth-service-claude
spec:
  type: NodePort
  selector:
    app: java-spring-auth-service-claude
  ports:
    - port: 8080
      targetPort: 8080
