# MongoDB for the minikube demo: unauthenticated, no persistent volume — data is lost on pod
# restart. Matches the existing local-dev posture (see CLAUDE.md); a real deployment needs
# auth + a PersistentVolumeClaim, deliberately left out here to keep the demo self-contained.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
