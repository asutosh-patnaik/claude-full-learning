# Dev-only key material reused from application.properties, for demo purposes only —
# see CLAUDE.md's "Key rotation" section for how this would actually be managed/rotated in
# a real deployment (a proper secrets manager, not a plain Kubernetes Secret checked into git).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  jwt-active-key-id: "dev-key-1"
  jwt-key-id: "dev-key-1"
  jwt-private-key: ""
  jwt-public-key: ""
  jwt-expiration-ms: "3600000"
